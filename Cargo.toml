[package]
name = "kestrel"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.11"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
