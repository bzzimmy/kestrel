[package]
name = "kestrel"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Ultra-lightweight secret scanner"
license = "MIT"
repository = "https://github.com/bzzimmy/kestrel"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.11"
rayon = "1.12.0"
regex = "1.13.1"
regex-syntax = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
test-case = "3.3.1"
